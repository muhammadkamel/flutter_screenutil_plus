name: flutter_screenutil_plus
description: A powerful Flutter plugin for adaptive screen and font scaling with CSS-like breakpoints, SwiftUI-style size classes, and container-aware LayoutScope for nested panes.
version: 1.6.0
homepage: https://github.com/muhammadkamel/flutter_screenutil_plus
repository: https://github.com/muhammadkamel/flutter_screenutil_plus
license: MIT

environment:
  sdk: ^3.12.2

dependencies:
  equatable: ^2.0.8
  flutter:
    sdk: flutter

dev_dependencies:
  alchemist: ^0.14.0
  benchmark_harness: ^2.4.0
  flutter_lints: ^6.0.0
  flutter_screenutil: ^5.9.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

